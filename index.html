<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="description" content="CurrentForm demo: versioned forecasting agents, evaluation experiments and SocialPredict market results.">
 <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
 <title>CurrentForm</title>
 <link rel="stylesheet" href="./styles.css">
 <script src="./vendor/lucide.js" defer></script>
 <script src="./app.js" defer></script>
</head>
<body>
<div id="cf-walkthrough" aria-label="CurrentForm">
 <div class="cf-shell">
  <header class="cf-top">
   <div class="cf-brand"><span class="cf-brandmark"><i data-lucide="waves" aria-hidden="true"></i></span>CurrentForm</div>
   <div class="cf-demo"><span class="cf-badge">Demo workspace</span><span class="cf-small cf-muted">Synthetic data · No live connections</span></div>
  </header>
  <div class="cf-layout">
   <aside class="cf-sidebar">
    <nav class="cf-nav" aria-label="Workspace"></nav>
    <div class="cf-sidefoot">SocialPredict<br><a href="https://github.com/StarlingsOne/currentform" target="_blank" rel="noopener noreferrer">Source on GitHub</a></div>
   </aside>
   <main class="cf-main">
    <div class="cf-heading"><span class="cf-eyebrow" id="cf-section"></span><h1 id="cf-title"></h1></div>
    <div class="cf-content" id="cf-content"></div>
   </main>
  </div>
 </div>
</div>
</body>
</html>
